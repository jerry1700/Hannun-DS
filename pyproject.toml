[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hannun"
version = "0.1.0"
description = "Hannun DS1 pipeline: news dedup, embedding, clustering"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "flake8>=7"]

[project.scripts]
hannun-ingest = "hannun.ingest.cli:main"
hannun-preprocess = "hannun.preprocess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
