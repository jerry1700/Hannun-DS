name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # 임베딩 그룹(torch)은 테스트에 필요 없다 — 인코더는 결정적 스텁으로 대체된다
      - run: pip install -e ".[dev,clustering]" -c constraints.txt
      - run: python -m flake8 src tests scripts dags --select=E9,F63,F7,F82,E501 --max-line-length=110 --jobs=1
      - run: python -m pytest tests/ -q
